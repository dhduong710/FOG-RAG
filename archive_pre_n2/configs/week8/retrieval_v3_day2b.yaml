seed: 2025

graph_path: dataset/setting_a/02_graph/train_enriched_deg1000_final.tsv
train_queries_path: dataset/setting_a/01_split/train.tsv
valid_queries_path: dataset/setting_a/01_split/valid.tsv
test_queries_path: dataset/setting_a/01_split/test.tsv

entity2id_path: dataset/setting_a/04_drkgc_json/entity2id.pkl
id2entity_path: dataset/setting_a/04_drkgc_json/id2entity.pkl
relation2id_path: dataset/setting_a/04_drkgc_json/relation2id.pkl
id2relation_path: dataset/setting_a/04_drkgc_json/id2relation.pkl

# warm-start from week7-v2
init_checkpoint_path: dataset/setting_a/11_ranker_v2/rgcn_ranker_v2_checkpoint.pt

# query-specific raw candidates
train_top20_raw_json: dataset/setting_a/11_ranker_v2/train_top20_raw.json
valid_top20_raw_json: dataset/setting_a/11_ranker_v2/valid_top20_raw.json

# retrieval-v3 prep artifacts
collapse_summary_path: dataset/setting_a/13_retrieval_v3_prep/collapse_summary.json
drug_bias_stats_path: dataset/setting_a/13_retrieval_v3_prep/drug_bias_stats.json

output_dir: dataset/setting_a/14_ranker_v3_day2b
report_dir: reports/week8

target_relation: indication
candidate_universe: drug_only

# warm-start fine-tuning, not scratch
learning_rate: 2.0e-5
weight_decay: 1.0e-4
num_epochs: 16
early_stop_patience: 5

batch_size: 512
num_negatives: 24
grad_clip_norm: 1.0

embedding_dim: 128
hidden_dim: 128
num_rgcn_layers: 2
dropout: 0.1
margin: 1.0

log_every_epochs: 1
valid_probe_size: 100
save_every_epochs: 1

# revised mixed-negative quotas
raw_keep: 16
collapse_keep: 4
bias_keep: 2
random_fill: true
random_fill_max: 2

# reporting targets from previous runs
week7_v2_probe_recall20_target: 0.26
week7_v2_probe_top1_dominance_target: 0.50