run_name: backbone_valid_posthoc_3b

model_name_or_path: meta-llama/Llama-3.2-3B
model_type: llama

dataset_path: dataset/setting_a/16_backbone_ready_posthoc_debias
kge_embedding_path: dataset/setting_a/08_backbone_ready/entity_embeddings_rgcn.pt

output_dir: results/week8/backbone_valid_posthoc_3b
checkpoint_dir: results/week8/backbone_valid_posthoc_3b/checkpoint-final

source_max_len: 768
target_max_len: 64

num_train_epochs: 1.0
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
dataloader_num_workers: 4

learning_rate: 2.0e-4
lora_r: 32
lora_alpha: 32
lora_dropout: 0.1

optim: paged_adamw_32bit
lr_scheduler_type: constant
warmup_ratio: 0.03

logging_steps: 50
seed: 2025

precision: bf16
report_to: none
overwrite_output_dir: true

generation:
  max_new_tokens: 64
  min_new_tokens: 1
  do_sample: false
  num_beams: 1
  num_return_sequences: 1
  use_cache: true

compare_against:
  week6_valid_metrics: results/week6/backbone_llama32_3b_rgcn_real/valid_eval/eval_valid_metrics.json
  week7_valid_metrics: results/week7/backbone_valid_v2_short/valid_eval_v2/eval_valid_v2_metrics.json
  week7_8b_valid_metrics: results/week7/backbone_valid_v2_8b_full/valid_eval_8b/eval_valid_8b_metrics.json
  posthoc_candidate_report: dataset/setting_a/15_posthoc_debias/best_lambda_artifacts/candidate_report.json