seed: 2025

graph_path: dataset/setting_a/02_graph/train_enriched_deg1000_final.tsv
train_queries_path: dataset/setting_a/01_split/train.tsv
valid_queries_path: dataset/setting_a/01_split/valid.tsv
test_queries_path: dataset/setting_a/01_split/test.tsv

entity2id_path: dataset/setting_a/04_drkgc_json/entity2id.pkl
id2entity_path: dataset/setting_a/04_drkgc_json/id2entity.pkl
relation2id_path: dataset/setting_a/04_drkgc_json/relation2id.pkl
id2relation_path: dataset/setting_a/04_drkgc_json/id2relation.pkl

output_dir: dataset/setting_a/11_ranker_v2

# reports
report_dir: reports/week7

target_relation: indication
candidate_universe: drug_only

# optimization: stability-first
learning_rate: 5.0e-5
weight_decay: 1.0e-4
num_epochs: 40
early_stop_patience: 8

batch_size: 512
num_negatives: 32
grad_clip_norm: 1.0

# model
embedding_dim: 128
hidden_dim: 128
num_rgcn_layers: 2
dropout: 0.1

# logging / probing
log_every_epochs: 1
valid_probe_size: 100
save_every_epochs: 1

# scoring
margin: 1.0